name: A21 Apply Portfolio Source Truth

on:
  push:
    branches:
      - a21/portfolio-dogfood-source-truth

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[a21-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: a21/portfolio-dogfood-source-truth
          fetch-depth: 0

      - name: Apply A21 source-truth migration
        run: python3 scripts/a21_portfolio_source_truth.py

      - name: Verify raw source invariants
        run: |
          test ! -f portfolio-product-upgrade.js
          ! grep -q 'portfolio-product-upgrade.js' index.html
          ! grep -q '<a href="#">Case ↗</a>' index.html
          grep -q 'id="ai-workflow"' index.html
          grep -q 'id="writing"' index.html
          grep -q 'case-study-flux.html' index.html
          grep -q 'case-study-access.html' index.html
          grep -q 'data-project="hue-between-river-citadel"' index.html
          grep -q 'HTML/CSS/JS prototypes' index.html
          grep -q 'Do_Anh_Nghia_Product_Designer_CV.pdf' index.html

      - name: Commit migration output
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No migration diff to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'A21: make recruiter source truth static [a21-applied]'
          git push origin HEAD:a21/portfolio-dogfood-source-truth
