name: A21 Portfolio Postcheck Fix

on:
  push:
    branches:
      - a21/portfolio-dogfood-source-truth

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[a21-postcheck]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: a21/portfolio-dogfood-source-truth
          fetch-depth: 0
      - name: Apply postcheck repair
        run: python3 scripts/a21_postcheck_fix.py
      - name: Verify source counts
        run: |
          grep -q 'Culture &amp; Experimental <b>2</b>' index.html
          test "$(grep -o '<span class="project-no">' index.html | wc -l)" -eq 14
          ! grep -q '<a href="#">Case ↗</a>' index.html
          ! grep -q 'portfolio-product-upgrade.js' index.html
      - name: Commit repair
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No postcheck diff to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'A21: align static project counts [a21-postcheck]'
          git push origin HEAD:a21/portfolio-dogfood-source-truth
