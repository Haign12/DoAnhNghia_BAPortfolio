name: A27 Senior Decision Evidence

on:
  push:
    branches:
      - a27/senior-decision-evidence

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[a27-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout A27 branch
        uses: actions/checkout@v4
        with:
          ref: a27/senior-decision-evidence
          fetch-depth: 0

      - name: Run A27 migration
        run: python .github/a27_migrate.py

      - name: Verify A27 source invariants
        run: |
          test -f docs/senior-decision-evidence.json
          test "$(grep -l 'A27_SENIOR_DECISION_EVIDENCE' case-study-*.html | wc -l)" -eq 18
          grep -q 'A27 Senior Decision Evidence' case-study-evidence-v4.css
          grep -q 'A27 senior decision evidence is explicit and honest across every local case' qa/portfolio-v5.spec.mjs

      - name: Commit A27 migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add case-study-*.html case-study-evidence-v4.css docs/senior-decision-evidence.json qa/portfolio-v5.spec.mjs
          git commit -m 'Add A27 senior decision evidence across case studies [a27-applied]'
          git push origin HEAD:a27/senior-decision-evidence
