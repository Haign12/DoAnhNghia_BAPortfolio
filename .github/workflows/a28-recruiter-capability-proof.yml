name: A28 Recruiter Capability Proof

on:
  push:
    branches:
      - a28/recruiter-capability-proof

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[a28-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout A28 branch
        uses: actions/checkout@v4
        with:
          ref: a28/recruiter-capability-proof
          fetch-depth: 0
      - name: Apply A28 capability proof
        run: python .github/a28_capability_proof.py
      - name: Verify A28 source invariants
        run: |
          test -f docs/recruiter-capability-map.json
          grep -q 'A28_RECRUITER_CAPABILITY_PROOF' index.html
          test "$(grep -o 'class="capability-proof-card' index.html | wc -l)" -eq 6
          test "$(grep -o 'class="flagship-senior-signals' index.html | wc -l)" -eq 3
          grep -q 'A28 Recruiter Capability Proof' portfolio-product-upgrade.css
          grep -q 'A28 recruiter scan maps senior-level capabilities' qa/portfolio-v5.spec.mjs
      - name: Commit A28 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html portfolio-product-upgrade.css qa/portfolio-v5.spec.mjs docs/recruiter-capability-map.json
          git commit -m 'Add A28 recruiter capability proof [a28-applied]'
          git push origin HEAD:a28/recruiter-capability-proof
