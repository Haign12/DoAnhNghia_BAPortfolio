name: A29 QA Assertion Repair

on:
  push:
    branches:
      - a29/supporting-skill-evidence-library

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[a29-qa-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a29/supporting-skill-evidence-library
          fetch-depth: 0
      - name: Update stale supporting-work headline assertions
        run: |
          python -c "from pathlib import Path; p=Path('qa/portfolio-v5.spec.mjs'); s=p.read_text(encoding='utf-8'); old=\"Breadth without diluting the narrative.\"; new=\"Breadth, with proof attached.\"; assert s.count(old)==2, s.count(old); p.write_text(s.replace(old,new), encoding='utf-8')"
      - name: Commit repaired assertions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/portfolio-v5.spec.mjs
          git commit -m 'Repair A29 supporting headline assertions [a29-qa-fixed]'
          git push origin HEAD:a29/supporting-skill-evidence-library
