name: A30 Senior Project Evidence Audit

on:
  push:
    branches:
      - a30/senior-project-maturity-evidence

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a30/senior-project-maturity-evidence
      - name: Audit visible project evidence
        run: python .github/a30_audit.py
