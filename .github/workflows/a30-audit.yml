name: A30 Senior Project Evidence Completeness

on:
  push:
    branches:
      - a30/senior-project-maturity-evidence

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[a30-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a30/senior-project-maturity-evidence
          fetch-depth: 0
      - name: Apply A30 evidence-completeness upgrade
        run: python .github/a30_audit.py
      - name: Verify A30 source invariants
        run: |
          test -f docs/project-maturity-audit.json
          test -f docs/project-evidence-roadmap.md
          test -f docs/figma-senior-system-plan.md
          test -f docs/prototype-senior-coverage-plan.md
          test -f case-study-lumen.html
          test -f case-study-hue.html
          grep -q 'A30_PROJECT_EVIDENCE_COMPLETENESS' index.html
          test "$(grep -o 'class="project-proof-facts' index.html | wc -l)" -eq 14
          grep -q 'A30 project evidence completeness' qa/portfolio-v5.spec.mjs
      - name: Commit A30 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html portfolio-product-upgrade.css qa/portfolio-v5.spec.mjs sitemap.xml \
            docs/project-maturity-audit.json docs/project-evidence-roadmap.md docs/figma-senior-system-plan.md docs/prototype-senior-coverage-plan.md \
            docs/senior-decision-evidence.json docs/measurement-targets.json case-study-lumen.html case-study-hue.html \
            case-study-luxroom.html case-study-atelier.html case-study-violet-marketplace.html case-study-flux.html case-study-sentry.html case-study-access.html case-study-vas-education.html case-study-uiux-factory.html
          git commit -m 'Add A30 senior project evidence completeness [a30-applied]'
          git push origin HEAD:a30/senior-project-maturity-evidence
