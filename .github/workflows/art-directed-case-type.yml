name: Art Directed Case Typography

on:
  push:
    branches:
      - redesign/art-directed-discovery-20260904
    paths:
      - tools/apply_case_art_direction.py
      - .github/workflows/art-directed-case-type.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/art-directed-discovery-20260904
      - name: Apply shared case typography
        run: python3 tools/apply_case_art_direction.py
      - name: Commit generated source changes
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "Nghĩaaaa"
          git config user.email "93433772+Haign12@users.noreply.github.com"
          git add case-study.css case-study-luxroom.html case-study-atelier.html case-study-studioos.html case-study-vas-education.html case-study-ux.html
