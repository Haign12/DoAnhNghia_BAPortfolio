name: Verify UIUX Designer CV

on:
  push:
    branches: [main]
    paths:
      - "Do_Anh_Nghia_UIUXDesigner_CV.pdf"
      - "index.html"
      - "case-study-professional-work.html"
      - "case-study-ux.html"
      - "qa/portfolio-v5.spec.mjs"
      - ".github/workflows/build-cv.yml"
  pull_request:
    branches: [main]
    paths:
      - "Do_Anh_Nghia_UIUXDesigner_CV.pdf"
      - "index.html"
      - "case-study-professional-work.html"
      - "case-study-ux.html"
      - "qa/portfolio-v5.spec.mjs"
      - ".github/workflows/build-cv.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Verify canonical CV asset
        run: |
          test -f Do_Anh_Nghia_UIUXDesigner_CV.pdf
          pages="$(pdfinfo Do_Anh_Nghia_UIUXDesigner_CV.pdf | awk '/^Pages:/ {print $2}')"
          echo "CV page count: ${pages}"
          test "${pages}" = "1"
          pdfinfo Do_Anh_Nghia_UIUXDesigner_CV.pdf | grep -q "^Page size:"
          echo "Canonical CV verified: Do_Anh_Nghia_UIUXDesigner_CV.pdf"

      - name: Verify portfolio references
        run: |
          grep -q 'Do_Anh_Nghia_UIUXDesigner_CV.pdf' index.html
          grep -q 'Do_Anh_Nghia_UIUXDesigner_CV.pdf' case-study-professional-work.html
          grep -q 'Do_Anh_Nghia_UIUXDesigner_CV.pdf' case-study-ux.html
          if grep -R "Do_Anh_Nghia_Product_Designer_CV.pdf"             index.html case-study-professional-work.html case-study-ux.html             qa/portfolio-v5.spec.mjs README.md docs/cover-letters/Cover_Letter_General_UIUX.txt; then
            echo "Legacy Product Designer CV reference still exists."
            exit 1
          fi
