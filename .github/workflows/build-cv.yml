name: Build CV PDF

on:
  push:
    branches: [main]
    paths:
      - "cv/main.typ"
      - ".github/workflows/build-cv.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF verification tools and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils fonts-noto-core

      - name: Setup Typst
        uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15.1"

      - name: Compile CV
        run: |
          typst compile cv/main.typ cv/main.pdf
          cp cv/main.pdf Do_Anh_Nghia_CV.pdf
          cp cv/main.pdf Do_Anh_Nghia_UIUXDesigner_CV.pdf

      - name: Verify recruiter PDF
        run: |
          pages="$(pdfinfo cv/main.pdf | awk '/^Pages:/ {print $2}')"
          echo "CV page count: ${pages}"
          test "${pages}" = "1"
          text="$(pdftotext cv/main.pdf -)"
          printf '%s' "$text" | grep -q "Selected Product & Operations Work"
          printf '%s' "$text" | grep -q "Nova"
          printf '%s' "$text" | grep -q "Sentry"
          printf '%s' "$text" | grep -q "UIUX Factory"
          printf '%s' "$text" | grep -q "VAS Education"
          printf '%s' "$text" | grep -q "Design Operations"

      - name: Commit generated PDFs
        run: |
          if git diff --quiet -- cv/main.pdf Do_Anh_Nghia_CV.pdf Do_Anh_Nghia_UIUXDesigner_CV.pdf; then
            echo "CV PDFs are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv/main.pdf Do_Anh_Nghia_CV.pdf Do_Anh_Nghia_UIUXDesigner_CV.pdf
          git commit -m "Build updated product design CV PDF"
          git push
