name: Fix mobile nav QA label

on:
  push:
    branches:
      - feat/lean-flagship-homepage-v2
    paths:
      - .github/workflows/fix-mobile-nav-qa-label.yml
      - scripts/fix-mobile-nav-qa-label.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/lean-flagship-homepage-v2
          fetch-depth: 0
      - run: python scripts/fix-mobile-nav-qa-label.py
      - name: Commit QA label sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: sync mobile nav with How I work label"
          git push origin HEAD:feat/lean-flagship-homepage-v2
