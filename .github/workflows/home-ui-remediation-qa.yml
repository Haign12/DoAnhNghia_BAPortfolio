name: Home UI Remediation QA

on:
  push:
    branches:
      - remediation/css-ux-project-groups-motion-20260904
    paths:
      - .github/workflows/home-ui-remediation-qa.yml

permissions:
  contents: write

jobs:
  remediate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation/css-ux-project-groups-motion-20260904
          fetch-depth: 0

      - name: Apply deterministic Home remediation
        run: python3 tools/apply_home_ui_remediation.py

      - name: Verify patch cleanliness
        run: git diff --check

      - name: Commit implementation candidate
        run: |
          git config user.name "Nghĩaaaa"
          git config user.email "93433772+Haign12@users.noreply.github.com"
          git add index.html styles.css
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
          else
            git commit -m "fix: improve Home hierarchy, crop and work grouping"
            git push origin HEAD:remediation/css-ux-project-groups-motion-20260904
          fi
          mkdir -p qa-artifacts
          git rev-parse HEAD > qa-artifacts/candidate-sha.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chromium QA runtime
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Serve static portfolio
        run: |
          python3 -m http.server 4173 > /tmp/home-ui-server.log 2>&1 &
          echo $! > /tmp/home-ui-server.pid
          curl --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:4173/index.html > /dev/null

      - name: Render and verify Home UI
        run: node tools/home_ui_qa.mjs

      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-ui-remediation-qa
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 7
