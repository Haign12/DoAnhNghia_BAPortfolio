name: Lean homepage QA contract fix

on:
  push:
    branches:
      - feat/lean-flagship-homepage-v2
    paths:
      - .github/workflows/lean-homepage-qa-fix.yml
      - scripts/lean-homepage-qa-fix.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/lean-flagship-homepage-v2
          fetch-depth: 0
      - run: python scripts/lean-homepage-qa-fix.py
      - name: Commit QA contract update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: align portfolio QA with lean flagship hierarchy"
          git push origin HEAD:feat/lean-flagship-homepage-v2
