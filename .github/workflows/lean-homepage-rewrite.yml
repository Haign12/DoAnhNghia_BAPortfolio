name: Lean flagship homepage rewrite

on:
  push:
    branches:
      - feat/lean-flagship-homepage-v2
    paths:
      - .github/workflows/lean-homepage-rewrite.yml
      - scripts/lean-homepage-rewrite.py

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/lean-flagship-homepage-v2
          fetch-depth: 0

      - name: Rewrite source-of-truth homepage
        run: python scripts/lean-homepage-rewrite.py

      - name: Commit rewritten homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: refocus homepage on three product flagships"
          git push origin HEAD:feat/lean-flagship-homepage-v2
