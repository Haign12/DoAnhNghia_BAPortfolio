name: Minimalism Remediation QA v3

on:
  push:
    branches:
      - remediation/minimal-white-20260904

permissions:
  contents: write

jobs:
  remediate-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation/minimal-white-20260904

      - name: Apply shared-owner remediation once
        shell: bash
        run: |
          set -euo pipefail
          msg="$(git log -1 --pretty=%s)"
          if [ "$msg" != "style: apply monochrome minimal portfolio system" ]; then
            python3 .github/scripts/apply_minimalism.py
            git config user.name 'Nghĩaaaa'
            git config user.email '93433772+Haign12@users.noreply.github.com'
            git add index.html case-study-*.html styles.css case-study.css
            git commit -m 'style: apply monochrome minimal portfolio system'
            git push origin HEAD:remediation/minimal-white-20260904
          fi

      - name: Static assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q -- '--bg: #ffffff' styles.css
          grep -q -- '--text: #111111' styles.css
          grep -q -- '--accent: #111111' styles.css
          grep -q -- '--sans: "Inter"' styles.css
          grep -q 'width: min(100%, 1040px)' styles.css
          grep -q 'family=Inter' index.html
          grep -q -- '--bg: #ffffff' case-study.css
          grep -q -- '--sans: "Inter"' case-study.css

      - name: Start local server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/minimal-http.log 2>&1 &
          echo $! > /tmp/minimal-http.pid
          sleep 2
          curl -fsS http://127.0.0.1:4173/ >/dev/null

      - name: Render desktop and work evidence
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          mkdir -p evidence/minimal/screens
          for width in 1280 1440 1920; do
            "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size="${width},1080" --virtual-time-budget=5000 --screenshot="evidence/minimal/screens/home-${width}x1080.png" "http://127.0.0.1:4173/"
          done
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size="1440,1080" --virtual-time-budget=5000 --screenshot="evidence/minimal/screens/work-1440x1080.png" "http://127.0.0.1:4173/#work"
          for route in case-study-luxroom.html case-study-vas-education.html case-study-ux.html; do
            name="${route%.html}"
            "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size="1440,1080" --virtual-time-budget=5000 --screenshot="evidence/minimal/screens/${name}-1440x1080.png" "http://127.0.0.1:4173/${route}"
          done

      - name: Runtime style smoke
        shell: bash
        run: |
          python3 -m pip install --quiet selenium
          python3 - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          import json, time
          o=Options(); o.add_argument('--headless=new'); o.add_argument('--no-sandbox'); o.add_argument('--disable-gpu'); o.add_argument('--window-size=1440,1080')
          o.set_capability('goog:loggingPrefs', {'browser':'ALL'})
          d=webdriver.Chrome(options=o); out={}
          try:
              d.get('http://127.0.0.1:4173/'); time.sleep(1)
              body=d.find_element(By.TAG_NAME,'body')
              h1=d.find_element(By.TAG_NAME,'h1')
              btn=d.find_element(By.CSS_SELECTOR,'.primary-link')
              media=d.find_element(By.CSS_SELECTOR,'.folio-media')
              out['body_font']=d.execute_script('return getComputedStyle(arguments[0]).fontFamily',body)
              out['h1_font']=d.execute_script('return getComputedStyle(arguments[0]).fontFamily',h1)
              out['body_bg']=d.execute_script('return getComputedStyle(arguments[0]).backgroundColor',body)
              out['button_bg']=d.execute_script('return getComputedStyle(arguments[0]).backgroundColor',btn)
              out['media_width']=d.execute_script('return arguments[0].getBoundingClientRect().width',media)
              out['overflow']=d.execute_script('return document.documentElement.scrollWidth > innerWidth')
              out['console_severe']=[x for x in d.get_log('browser') if x.get('level')=='SEVERE']
              assert 'Inter' in out['body_font']
              assert 'Inter' in out['h1_font']
              assert out['body_bg']=='rgb(255, 255, 255)'
              assert out['button_bg']=='rgb(17, 17, 17)'
              assert out['media_width'] <= 1041
              assert not out['overflow']
              assert not out['console_severe']
          finally:
              d.quit()
          open('evidence/minimal/runtime.json','w').write(json.dumps(out,indent=2,ensure_ascii=False))
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: minimalism-remediation-evidence
          path: evidence/minimal
          retention-days: 7

      - name: Stop server
        if: always()
        run: if [ -f /tmp/minimal-http.pid ]; then kill "$(cat /tmp/minimal-http.pid)" || true; fi
