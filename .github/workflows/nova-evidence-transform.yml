name: Nova evidence transform

on:
  push:
    branches:
      - evidence/nova-direct-user-round01

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evidence/nova-direct-user-round01
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply Nova evidence transform
        run: |
          node scripts/apply-nova-direct-user-evidence.mjs
          git diff --check
          node -e "JSON.parse(require('fs').readFileSync('docs/measurement-targets.json','utf8')); JSON.parse(require('fs').readFileSync('docs/senior-decision-evidence.json','utf8')); JSON.parse(require('fs').readFileSync('docs/project-maturity-audit.json','utf8'))"

      - name: Commit transformed portfolio source
        run: |
          if git diff --quiet; then
            echo "No evidence transform diff to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add case-study-nova.html index.html cv/main.typ docs/measurement-targets.json docs/senior-decision-evidence.json docs/project-maturity-audit.json docs/project-evidence-roadmap.md qa/portfolio-v5.spec.mjs
          git commit -m "docs: update Nova portfolio with direct-user evidence"
          git push origin HEAD:evidence/nova-direct-user-round01
