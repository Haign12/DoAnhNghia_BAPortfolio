name: Patch Sentry live URL

on:
  push:
    branches:
      - fix/sentry-live-url

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/sentry-live-url
          fetch-depth: 0

      - name: Replace canonical Sentry prototype URL
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = "https://sentry-9bqs.vercel.app/"
          new = "https://sentry-xi-lime.vercel.app/"
          paths = [
              Path("index.html"),
              Path("case-study-sentry.html"),
              Path("getlayers-preview.html"),
              Path("docs/supporting-capability-signals.json"),
          ]

          changed = []
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if old in text:
                  path.write_text(text.replace(old, new), encoding="utf-8")
                  changed.append(str(path))

          if not changed:
              print("No stale Sentry URL found; nothing to patch.")
          else:
              print("Updated:", ", ".join(changed))

          stale = [str(path) for path in paths if old in path.read_text(encoding="utf-8")]
          if stale:
              raise SystemExit("Stale Sentry URL remains in: " + ", ".join(stale))
          PY

      - name: Commit replacement when needed
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html case-study-sentry.html getlayers-preview.html docs/supporting-capability-signals.json
          git commit -m "fix: update Sentry live prototype URL"
          git push origin HEAD:fix/sentry-live-url
