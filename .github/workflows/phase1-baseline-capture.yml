name: Patch Phase 2 Home Root Layout

on:
  push:
    branches:
      - qa/phase1-baseline-20260903

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2/luxury-minimalism-implementation-20260903
          fetch-depth: 0
      - name: Patch home composition in root stylesheet
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('styles.css')
          s = p.read_text()
          replacements = {
          '''.hero {
            min-height: calc(100vh - 74px);
            padding-block: clamp(72px, 7vw, 116px) 84px;
            display: grid;
            grid-template-columns: repeat(12, minmax(0, 1fr));
            column-gap: 24px;
            row-gap: 38px;
            align-items: end;
          }''': '''.hero {
            min-height: 0;
            padding-block: clamp(46px, 4.8vw, 72px) clamp(54px, 5.2vw, 78px);
            display: grid;
            grid-template-columns: repeat(12, minmax(0, 1fr));
            column-gap: 24px;
            row-gap: 28px;
            align-items: start;
          }''',
          '''.hero-copy {
            grid-column: 1 / 9;
            align-self: center;
            padding-top: 24px;
          }''': '''.hero-copy {
            grid-column: 1 / 8;
            align-self: start;
            padding-top: 0;
          }''',
          '''.hero-portrait {
            grid-column: 10 / 13;
            align-self: end;
            margin: 0;
          }''': '''.hero-portrait {
            grid-column: 9 / 13;
            align-self: start;
            margin: 0;
          }''',
          '''.hero-note {
            grid-column: 1 / 6;
            display: grid;
            grid-template-columns: 80px 1fr;
            gap: 18px;
            align-items: start;
            padding-top: 18px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 12px;
            line-height: 1.55;
          }''': '''.hero-note { display: none; }''',
          '''.work { border-top: 1px solid var(--line); }''': '''.work { border-top: 1px solid var(--line); }
          #work.section-pad { padding-top: clamp(82px, 7vw, 110px); }''',
          '''  .hero { column-gap: 20px; }
            .hero-copy { grid-column: 1 / 9; }
            .hero-portrait { grid-column: 10 / 13; }
            .hero-copy h1 { font-size: clamp(4.4rem, 7.1vw, 6.9rem); }''': '''  .hero { column-gap: 20px; padding-block: 42px 54px; row-gap: 24px; }
            .hero-copy { grid-column: 1 / 8; }
            .hero-portrait { grid-column: 9 / 13; }
            .hero-copy h1 { margin-bottom: 24px; font-size: clamp(3.9rem, 5.8vw, 5.25rem); }
            .hero-lead { margin-bottom: 26px; font-size: 1rem; line-height: 1.62; }'''
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected owner block not found:\n{old[:90]}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git config user.name "Nghĩaaaa"
          git config user.email "93433772+Haign12@users.noreply.github.com"
          git add styles.css
          git diff --cached --check
          git commit -m "fix: tighten home proof-first composition"
          git push origin HEAD:phase2/luxury-minimalism-implementation-20260903
