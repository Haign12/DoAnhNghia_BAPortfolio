name: Phase 2 Home Fix Verification

on:
  push:
    branches:
      - qa/phase1-baseline-20260903

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d2889fbb28dbb496ee0687eefecd406f660c5108
      - name: Static source checks
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html && test -f styles.css && test -f script.js
          grep -q '<html lang="vi"' index.html
          grep -q 'id="work"' index.html
          grep -q 'id="experience"' index.html
          grep -q 'id="contact"' index.html
          grep -q 'prefers-reduced-motion' styles.css
          grep -q ':focus-visible' styles.css
          ! grep -q 'grayscale(1)' styles.css
      - name: Render affected route and regression representatives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/phase2-home-fixed
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          PID=$!; trap 'kill "$PID" || true' EXIT; sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          for width in 1280 1440 1920; do
            "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size="${width},1080" --virtual-time-budget=4000 --screenshot="evidence/phase2-home-fixed/home-${width}x1080.png" "http://127.0.0.1:4173/index.html"
          done
          for route in case-study-luxroom.html case-study-vas-education.html case-study-ux.html; do
            name="${route%.html}"
            "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size="1440,1080" --virtual-time-budget=4000 --screenshot="evidence/phase2-home-fixed/${name}-1440x1080.png" "http://127.0.0.1:4173/${route}"
          done
          printf '%s\n' 'Source commit: d2889fbb28dbb496ee0687eefecd406f660c5108' 'Home: 1280/1440/1920' 'Regression reps: LuxRoom/VAS/FlowCRM @ 1440' > evidence/phase2-home-fixed/manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phase2-home-fixed
          path: evidence/phase2-home-fixed
          if-no-files-found: error
          retention-days: 7
