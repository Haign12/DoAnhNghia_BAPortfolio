name: Phase 2 FlowCRM Recapture

on:
  push:
    branches:
      - qa/phase1-baseline-20260903

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eac46d8fb4ab9391b1dbfcc2eb0ec7f667df9c2f
      - name: Capture fixed FlowCRM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/flowcrm-fixed
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          PID=$!; trap 'kill "$PID" || true' EXIT; sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          for width in 1280 1440 1920; do
            "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size="${width},1080" --virtual-time-budget=4000 --screenshot="evidence/flowcrm-fixed/archive-case-${width}x1080.png" "http://127.0.0.1:4173/case-study-ux.html"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: phase2-flowcrm-fixed
          path: evidence/flowcrm-fixed
          if-no-files-found: error
          retention-days: 7
