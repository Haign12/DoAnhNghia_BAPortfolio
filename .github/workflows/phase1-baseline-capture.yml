name: Patch Phase 2 Home Scale

on:
  push:
    branches:
      - qa/phase1-baseline-20260903

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2/luxury-minimalism-implementation-20260903
          fetch-depth: 0
      - name: Patch hierarchy in root stylesheet
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('styles.css'); s=p.read_text()
          pairs=[
          ('font-size: clamp(4.75rem, 7.3vw, 8.2rem);','font-size: clamp(4.35rem, 5.8vw, 6.8rem);'),
          ('''  grid-column: 9 / 13;
            align-self: start;
            margin: 0;
          }''','''  grid-column: 9 / 13;
            align-self: start;
            justify-self: end;
            width: 100%;
            max-width: 390px;
            margin: 0;
          }'''),
          ('''  width: 100%;
            aspect-ratio: 3 / 4.1;
            object-fit: cover;''','''  width: 100%;
            height: clamp(480px, 40vw, 620px);
            object-fit: cover;''')]
          for old,new in pairs:
              if old not in s: raise SystemExit('expected block not found: '+old[:80])
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name "Nghĩaaaa"
          git config user.email "93433772+Haign12@users.noreply.github.com"
          git add styles.css
          git diff --cached --check
          git commit -m "fix: rebalance home display scale and portrait"
          git push origin HEAD:phase2/luxury-minimalism-implementation-20260903
