name: Phase 4 Production Smoke

on:
  push:
    branches:
      - qa/phase3-candidate-final-20260903

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact released source for reference
        uses: actions/checkout@v4
        with:
          ref: aef6a7c7299e607058fb6e84aaa86062553194f1

      - name: Wait for production version identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/phase4-production
          url='https://haign12.github.io/DoAnhNghia_BAPortfolio/'
          ok=0
          for i in $(seq 1 24); do
            html=$(curl -fsSL --max-time 20 "$url" || true)
            if printf '%s' "$html" | grep -q '<html lang="vi"' && printf '%s' "$html" | grep -q 'Tôi thiết kế sản phẩm số'; then
              printf '%s' "$html" > evidence/phase4-production/live-index.html
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
          sha256sum index.html evidence/phase4-production/live-index.html > evidence/phase4-production/version-hashes.txt
          grep -q 'case-study-vas-education.html' sitemap.xml
          curl -fsSL 'https://haign12.github.io/DoAnhNghia_BAPortfolio/sitemap.xml' | grep -q 'case-study-vas-education.html'

      - name: Render production desktop matrix
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          base='https://haign12.github.io/DoAnhNghia_BAPortfolio/'
          mkdir -p evidence/phase4-production/screens
          for width in 1280 1440 1920; do
            "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size="${width},1080" --virtual-time-budget=6000 --screenshot="evidence/phase4-production/screens/home-${width}x1080.png" "$base"
          done
          for route in case-study-luxroom.html case-study-atelier.html case-study-studioos.html case-study-vas-education.html case-study-ux.html; do
            name="${route%.html}"
            "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size="1440,1080" --virtual-time-budget=6000 --screenshot="evidence/phase4-production/screens/${name}-1440x1080.png" "${base}${route}"
          done

      - name: Production interaction and accessibility smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet selenium
          python3 - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.keys import Keys
          import json, time
          base='https://haign12.github.io/DoAnhNghia_BAPortfolio/'
          o=Options(); o.add_argument('--headless=new'); o.add_argument('--no-sandbox'); o.add_argument('--disable-gpu'); o.add_argument('--window-size=1440,1080')
          o.set_capability('goog:loggingPrefs', {'browser':'ALL'})
          d=webdriver.Chrome(options=o); out={}
          try:
              d.get(base); time.sleep(2)
              out['url']=d.current_url
              out['lang']=d.find_element(By.TAG_NAME,'html').get_attribute('lang')
              out['nav_aria_hidden']=d.find_element(By.ID,'navMenu').get_attribute('aria-hidden')
              out['mailto_count']=len(d.find_elements(By.CSS_SELECTOR,'a[href^="mailto:"]'))
              out['cv_count']=len(d.find_elements(By.CSS_SELECTOR,'a[href*="Do_Anh_Nghia_CV.pdf"]'))
              theme=d.find_element(By.ID,'themeToggle')
              before=d.find_element(By.TAG_NAME,'html').get_attribute('data-theme')
              theme.click(); time.sleep(.3)
              after=d.find_element(By.TAG_NAME,'html').get_attribute('data-theme')
              out['theme_transition']=f'{before}->{after}'
              d.find_element(By.TAG_NAME,'body').send_keys(Keys.TAB)
              out['active_after_tab']=d.switch_to.active_element.tag_name
              d.execute_cdp_cmd('Emulation.setEmulatedMedia', {'features':[{'name':'prefers-reduced-motion','value':'reduce'}]})
              out['reduced_motion_matches']=d.execute_script("return matchMedia('(prefers-reduced-motion: reduce)').matches")
              logs=d.get_log('browser')
              out['console_severe']=[x for x in logs if x.get('level')=='SEVERE']
              assert out['lang']=='vi'
              assert out['nav_aria_hidden'] in (None,'false')
              assert out['mailto_count']>=1 and out['cv_count']>=1
              assert before != after
              assert out['reduced_motion_matches'] is True
              assert not out['console_severe']
          finally:
              d.quit()
          with open('evidence/phase4-production/browser-smoke.json','w',encoding='utf-8') as f: json.dump(out,f,ensure_ascii=False,indent=2)
          PY

      - name: Production route and asset smoke
        shell: bash
        run: |
          set -euo pipefail
          base='https://haign12.github.io/DoAnhNghia_BAPortfolio'
          : > evidence/phase4-production/routes.txt
          for path in / /case-study-luxroom.html /case-study-atelier.html /case-study-studioos.html /case-study-vas-education.html /case-study-ux.html /Do_Anh_Nghia_CV.pdf /robots.txt /sitemap.xml /styles.css /script.js /assets/images/avatar.webp; do
            code=$(curl -sS -L -o /dev/null -w '%{http_code}' "${base}${path}")
            printf '%s %s\n' "$code" "$path" | tee -a evidence/phase4-production/routes.txt
            test "$code" = '200'
          done

      - name: Upload production smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase4-production-smoke
          path: evidence/phase4-production
          if-no-files-found: error
          retention-days: 7
