name: Temporary all-project CTA rollout runner

on:
  push:
    branches:
      - feat/all-project-cta-hierarchy

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/all-project-cta-hierarchy
          fetch-depth: 0

      - name: Guard rollout commit
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -q '\[cta-rollout\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run staged patch
        if: steps.guard.outputs.skip == 'false'
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/temporary-all-project-cta-rollout.yml').read_text()
          staged = source.split("python3 <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          exec(textwrap.dedent(staged), {'__name__': '__main__'})
          PY

      - name: Commit rollout
        if: steps.guard.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js case-study.js portfolio-product-upgrade.css case-study.css qa/all-project-cta-hierarchy.spec.mjs docs/dual-cta-contract.md .github/workflows/portfolio-cloud-qa-v5.yml
          if git diff --cached --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git commit -m "feat: apply recruiter CTA hierarchy to all projects [cta-rollout]"
          git push origin HEAD:feat/all-project-cta-hierarchy
