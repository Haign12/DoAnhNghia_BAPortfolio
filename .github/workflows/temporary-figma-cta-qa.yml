name: Temporary Figma CTA hierarchy QA

on:
  push:
    branches:
      - feat/figma-cta-hierarchy

permissions:
  contents: read

jobs:
  figma-cta-gate:
    name: Figma CTA hierarchy / desktop + mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install QA dependencies
        run: npm install --no-save @playwright/test@1.55.0 @axe-core/playwright@4.10.2
      - name: Install Chromium
        timeout-minutes: 8
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '120000'
        run: bash scripts/ci/install-playwright-chromium.sh
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/figma-cta-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/figma-cta-http.log
          exit 1
      - name: Run CTA hierarchy and rendered recruiter scan
        env:
          PORTFOLIO_BASE_URL: http://127.0.0.1:4173
        run: |
          mkdir -p qa-artifacts
          npx playwright test qa/figma-cta-hierarchy.spec.mjs qa/portfolio-v5.spec.mjs --browser=chromium --workers=1 --reporter=line
      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: figma-cta-rendered-evidence
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
