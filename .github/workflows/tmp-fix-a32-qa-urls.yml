name: Temporary A32 QA URL repair

on:
  push:
    branches:
      - feat/all-project-recruiter-proof-system

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/all-project-recruiter-proof-system
      - name: Repair A32 QA URLs
        run: python3 scripts/tmp-fix-a32-qa-urls.py
      - name: Commit QA repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/portfolio-v5.spec.mjs
          if git diff --cached --quiet; then
            echo "No QA changes"
            exit 0
          fi
          git commit -m "test: use portfolio base URL in A32 browser checks"
          git push origin HEAD:feat/all-project-recruiter-proof-system
