name: Temporary Nova homepage proof transform

on:
  push:
    branches:
      - feat/nova-home-recruiter-proof

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nova-home-recruiter-proof
      - name: Update recruiter-facing Nova proof
        run: python3 scripts/tmp-nova-home-proof.py
      - name: Commit transformed source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html qa/portfolio-v5.spec.mjs
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "feat: surface Nova two-round proof on homepage"
          git push origin HEAD:feat/nova-home-recruiter-proof
