<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinTrack | Neumorphic Ghost Detection</title>
  <link rel="icon" type="image/png" href="../logo.png?v=3">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="portfolio-demo-bar">
  <div class="demo-info"><span class="live-dot"></span><span class="demo-text">Interactive Prototype — Neumorphism UX</span></div>
  <a href="../index.html#project-01" class="back-portfolio-btn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    Back to Portfolio
  </a>
</div>

<div class="container">
  <!-- Top Navigation -->
  <header class="header">
    <div class="logo">Fin<span>Track.</span></div>
    <div class="profile-pic"><i class="ph ph-user"></i></div>
  </header>

  <div class="dashboard-grid">
    <!-- Main KPIs -->
    <div class="kpi-panel">
      <h2 class="section-title">Overview</h2>
      <div class="kpi-cards">
        <div class="neumorphic-card kpi-card">
          <div class="kpi-title">Monthly Fixed Cost</div>
          <div class="kpi-value" id="kpiTotalCost">0đ</div>
          <div class="kpi-subtitle">Across <span id="kpiActiveCount">0</span> active subs</div>
        </div>
        <div class="neumorphic-card kpi-card">
          <div class="kpi-title">Utilization Rate</div>
          <div class="kpi-value" id="kpiUtilization" style="color: var(--teal);">0%</div>
          <div class="kpi-subtitle">Based on 30-day activity</div>
        </div>
      </div>

      <!-- Subscription List -->
      <div class="neumorphic-card sub-list-container" style="margin-top: 32px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
          <h2 class="section-title" style="margin: 0;">Active Subscriptions</h2>
          <button class="neumorphic-btn-small" onclick="showToast('Add flow not implemented in demo', 'info')"><i class="ph ph-plus"></i></button>
        </div>
        <div class="sub-list" id="subscriptionList">
          <!-- Rendered via JS -->
        </div>
      </div>
    </div>

    <!-- Right Sidebar: Ghost Detection -->
    <div class="sidebar">
      <div class="neumorphic-card inset-card ghost-panel">
        <div class="ghost-header">
          <div class="ghost-icon"><i class="ph ph-ghost"></i></div>
          <div>
            <h3 style="font-size: 18px; font-weight: 700; color: var(--red);">Ghost Subscriptions</h3>
            <p style="font-size: 13px; color: var(--text-secondary); margin-top: 4px;">Detected via FR-03 rules</p>
          </div>
        </div>
        
        <div id="ghostList">
          <!-- Rendered via JS -->
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast-container" id="toastContainer"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
