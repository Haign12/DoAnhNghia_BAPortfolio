  <div class="unified-header">
    <nav class="top-nav">
      <div class="nav-brand">
        <div class="nav-brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 10L12 3L21 10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 10V20C5 20.5523 5.44772 21 6 21H18C18.5523 21 19 20.5523 19 20V10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 21V14H15V21" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <span class="nav-brand-name">Co<span style="color: #60A5FA;">Space.</span></span>

      <div class="nav-links">
        <a href="index.html" class="nav-link">Kanban Board</a>

    <div class="page-header">
      <div>
        <div class="page-greeting"><i class="ph ph-clock-counter-clockwise" style="margin-right: 8px;"></i>Chore History (Last 4 Weeks)</div>
        <div class="page-sub">Full transparency — see who completed what and when (US-104).</div>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top: 24px;">
    <div class="card-header">
      <div>
        <div class="card-title">Completion Log</div>
        <div class="card-subtitle">Sorted by date, most recent first</div>
      </div>
    </div>
    <table class="data-table">
      <thead>
        <tr>
          <th>Chore</th>
          <th>Assigned To</th>
          <th>Status</th>
          <th>Created</th>
          <th>Completed</th>
          <th>Week</th>
        </tr>
      </thead>
      <tbody id="historyTableBody"></tbody>
    </table>
  </div>
</div>
<script src="data.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const currentWeek = getWeekNumber(new Date());
  const history = chores.filter(c => c.week >= currentWeek - 4)
    .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  const tbody = document.getElementById('historyTableBody');
  tbody.innerHTML = history.map(c => `
    <tr>
      <td><strong>${c.title}</strong></td>
      <td>
        ${c.assignee ? `<div style="display:flex;align-items:center;gap:6px;">
          <div class="kanban-avatar small" style="background:${getMemberColor(c.assignee)}">${getMemberAvatar(c.assignee)}</div>
          ${getMemberName(c.assignee)}
        </div>` : '<span style="color:#888;">Unassigned</span>'}
      </td>
      <td><span class="badge badge-${c.status}">${c.status.replace('-', ' ')}</span></td>
      <td>${c.createdAt}</td>
      <td>${c.completedAt || '—'}</td>
      <td>W${c.week}</td>
    </tr>
  `).join('');
});
</script>
</body>
</html>
