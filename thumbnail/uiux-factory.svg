    <text x="82" y="700" fill="#f4f4ef" font-size="28" font-weight="700">MAKE DESIGN DECISIONS INSPECTABLE.</text>
    <text x="82" y="742" fill="#8d8d88" font-size="20">A reusable workflow that turns design intent into</text>
    <text x="82" y="774" fill="#8d8d88" font-size="20">implementation, rendered evidence and root-cause repair.</text>

